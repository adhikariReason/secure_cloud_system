{% for m in messages %}
<div class="alert {% if m.level_tag == 'error' %}a-bad{% elif m.level_tag == 'success' %}a-ok{% else %}a-info{% endif %}">
  <svg width="16" height="16"><use href="{% if m.level_tag == 'error' %}#i-alert{% elif m.level_tag == 'success' %}#i-check{% else %}#i-info{% endif %}"/></svg>
  <div>{{ m }}</div>
</div>
{% endfor %}
