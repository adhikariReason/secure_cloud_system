{% load sc %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Secure Cloud{% endblock %}</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2125; --muted: #626b74; --faint: #8a939c;
    --line: #dde1e6; --line-2: #eceef1; --accent: #1f5fae; --accent-ink: #fff; --accent-soft: #e8f0fa;
    --ok: #1d7a43; --ok-soft: #e6f4ec; --bad: #b3261e; --bad-soft: #fbeceb; --warn: #8a5a00; --warn-soft: #fdf4e3;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }

  /* top bar */
  .top { background: var(--panel); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1080px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 28px; height: 52px; }
  .brand { white-space: nowrap; display: flex; align-items: center; gap: 9px; font-weight: 650; color: var(--text); letter-spacing: .1px; }
  .brand:hover { text-decoration: none; }
  .mark { width: 24px; height: 24px; border-radius: 5px; background: #20262d; display: grid; place-items: center; }
  .tabs { display: flex; gap: 4px; height: 100%; }
  .tabs a { display: flex; align-items: center; gap: 7px; padding: 0 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--text); text-decoration: none; }
  .tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 550; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .who-name { display: flex; align-items: center; gap: 7px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: #dfe6ee; color: #34495e; display: grid; place-items: center; font-weight: 600; font-size: 12px; text-transform: uppercase; }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .crumb { color: var(--muted); margin-bottom: 4px; font-size: 13px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .panel-pad { padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .tabs a span { display: none; } .who-name span.u { display: none; } }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line);
         background: var(--panel); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f0f2f4; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: #1a5296; }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { background: var(--bad-soft); border-color: #efc6c3; }
  .btn-sm { height: 28px; padding: 0 9px; font-size: 13px; }
  .icon-btn { width: 30px; padding: 0; justify-content: center; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .actions form { margin: 0; }

  /* table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 550; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
       padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fafbfc; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fafbfc; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nowrap { white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .fname { display: flex; align-items: center; gap: 11px; min-width: 220px; }
  .fname a { color: var(--text); font-weight: 500; }
  .fname .sub { font-size: 12px; color: var(--faint); font-family: var(--mono); }

  /* file type tile */
  .ft { width: 32px; height: 38px; border-radius: 4px; position: relative; flex: none; background: #eef1f4; border: 1px solid #d9dee4;
        display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font: 700 8.5px/1 var(--mono); color: #55606b; }
  .ft::before { content: ""; position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; background: var(--bg); border-left: 1px solid #d9dee4; border-bottom: 1px solid #d9dee4; border-bottom-left-radius: 3px; }
  .ft-pdf { background: #fbe9e7; border-color: #f0c8c3; color: #a7322a; }
  .ft-img { background: #e8f3ea; border-color: #c6e1cc; color: #2c6e3f; }
  .ft-doc { background: #e7eef9; border-color: #c6d5ee; color: #2a5597; }
  .ft-sheet { background: #e6f3ef; border-color: #c2e0d5; color: #22694f; }
  .ft-slide { background: #fcefe3; border-color: #f0d3b6; color: #9a5413; }
  .ft-zip { background: #f6f0dc; border-color: #e5d8a8; color: #7a6312; }
  .ft-txt { background: #f0f1f3; }

  /* badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500;
           background: #eef0f3; color: #4a535c; white-space: nowrap; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-blue { background: var(--accent-soft); color: var(--accent); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }

  /* alerts */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 6px; border: 1px solid; margin-bottom: 14px; }
  .alert svg { flex: none; margin-top: 2px; }
  .a-ok { background: var(--ok-soft); border-color: #bfe0cb; color: #14532d; }
  .a-bad { background: var(--bad-soft); border-color: #f0c6c2; color: #7f1d1d; }
  .a-info { background: var(--accent-soft); border-color: #c9daf1; color: #173f72; }

  /* forms */
  label { display: block; font-weight: 550; margin-bottom: 5px; }
  input[type=text], input[type=password] { width: 100%; height: 36px; padding: 0 10px; border: 1px solid #c9cfd6; border-radius: 6px; font: inherit; background: #fff; }
  input[type=text]:focus, input[type=password]:focus { outline: 2px solid #b9d0ee; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field .help { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
  .field .help ul { margin: 4px 0 0; padding-left: 18px; }
  .errorlist { list-style: none; margin: 5px 0 0; padding: 0; color: var(--bad); font-size: 13px; }
  .inline-form { display: flex; gap: 8px; }
  .inline-form input { flex: 1; }

  /* dropzone */
  .dropzone { position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1.5px dashed #bfc7d0; border-radius: 8px; background: #fbfcfd; }
  .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.has-file { border-style: solid; border-color: #b9cde6; background: #f7faff; }
  .dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .dz-icon { width: 40px; height: 40px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; flex: none; color: var(--muted); }
  .dz-text { flex: 1; min-width: 0; }
  .dz-name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dz-upload { position: relative; z-index: 1; }

  /* key/value list */
  dl.kv { display: grid; grid-template-columns: 150px 1fr; margin: 0; }
  dl.kv dt { color: var(--muted); padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  dl.kv dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--line-2); word-break: break-all; }
  dl.kv > :nth-last-child(-n+2) { border-bottom: 0; }

  .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty svg { color: #b5bdc6; margin-bottom: 8px; }
  .list-plain { list-style: none; padding: 0; margin: 0; }
  .list-plain li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .list-plain li:last-child { border-bottom: 0; }
  .sep { height: 1px; background: var(--line-2); margin: 16px 0; }

  /* auth pages */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; font-weight: 650; font-size: 16px; }
  .auth-foot { text-align: center; margin-top: 14px; color: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lock" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2M3.5 7h9v6.5h-9z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M1.75 3.75h4.5l1.5 1.5h6.5v7.5H1.75z"/></symbol>
  <symbol id="i-users" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="5.5" r="2.25"/><path d="M1.75 13c.4-2.3 2.1-3.5 4.25-3.5s3.85 1.2 4.25 3.5"/><path d="M10.5 3.5a2.2 2.2 0 0 1 0 4.2M12 9.8c1.2.4 2 1.4 2.25 3.2"/></g></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M5.5 4h8M5.5 8h8M5.5 12h8M2.25 4h.5M2.25 8h.5M2.25 12h.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.75 13.5h10.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 11V2.75M4.5 6 8 2.5 11.5 6M2.75 13.5h10.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M2.5 4.25h11M6 4.25V2.75h4v1.5M4 4.25l.6 9h6.8l.6-9M6.75 6.75v4M9.25 6.75v4"/></symbol>
  <symbol id="i-share" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="3.5" r="1.75"/><circle cx="4" cy="8" r="1.75"/><circle cx="12" cy="12.5" r="1.75"/><path d="m5.6 7.1 4.8-2.7M5.6 8.9l4.8 2.7"/></g></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.25V11.5M8 4.75v.5"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" d="m3 8.5 3 3 7-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="i-shield" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M8 1.75 2.75 3.5v4.25c0 3.2 2.2 5.4 5.25 6.5 3.05-1.1 5.25-3.3 5.25-6.5V3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="m5.5 8 1.75 1.75L10.75 6.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.75 14.5 13.5h-13z"/><path d="M8 6v3.75M8 11.5v.5"/></g></symbol>
</svg>

{% block body %}
<header class="top">
  <div class="top-inner">
    <a class="brand" href="{% url 'file_list' %}">
      <span class="mark"><svg width="14" height="14" style="color:#fff"><use href="#i-lock"/></svg></span>Secure Cloud
    </a>
    <nav class="tabs">
      <a href="{% url 'file_list' %}" class="{% if tab == 'files' %}on{% endif %}"><svg width="16" height="16"><use href="#i-folder"/></svg><span>My files</span></a>
      <a href="{% url 'shared_list' %}" class="{% if tab == 'shared' %}on{% endif %}"><svg width="16" height="16"><use href="#i-users"/></svg><span>Shared with me</span></a>
      <a href="{% url 'audit_log' %}" class="{% if tab == 'audit' %}on{% endif %}"><svg width="16" height="16"><use href="#i-list"/></svg><span>Audit log</span></a>
    </nav>
    <div class="who">
      <span class="who-name"><span class="avatar">{{ user.username|first }}</span><span class="u">{{ user.username }}</span></span>
      <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn btn-sm">Sign out</button></form>
    </div>
  </div>
</header>
<main>
  {% include "messages.html" %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
