services:
  nginx:
    image: nginx:stable-alpine
    container_name: mynginx
    restart: unless-stopped
    ports:                        # the ONLY ports open to the outside
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web

  web:
    build: ./app
    container_name: django-web
    restart: unless-stopped
    expose:
      - "8000"                    # reachable by nginx only, not published
    volumes:
      - db_data:/app/data                     # SQLite: users, key pairs (private keys encrypted), file metadata, audit log
      - private_storage:/app/private_storage  # encrypted files only
    secrets:
      - django_secret_key         # signs sessions/CSRF; there is no file-encryption key on disk anymore

volumes:
  db_data:
  private_storage:

secrets:
  django_secret_key:
    file: /home/adhikarireason/securecloud-secrets/django_secret_key
